<igx-nav-drawer
  id="main-nav-drawer"
  [isOpen]="drawerOpen()"
  [pin]="true"
  aria-label="Main navigation">

  <ng-template igxDrawer>
    <div class="nav-header" aria-label="Marketing Control Panel">
      <igx-icon class="nav-logo" aria-hidden="true">campaign</igx-icon>
      <span class="nav-title">Content Hub</span>
    </div>

    <nav aria-label="Primary navigation">
      <span igxDrawerItem [active]="isActive('/dashboard')" igxRipple routerLink="/dashboard" aria-current="isActive('/dashboard') ? 'page' : null">
        <igx-icon igxDrawerItemIcon aria-hidden="true">dashboard</igx-icon>
        <span igxDrawerItemText>Dashboard</span>
      </span>

      <p class="nav-section-label">Product Areas</p>

      <span igxDrawerItem [active]="isActive('/product/dev-tools')" igxRipple routerLink="/product/dev-tools">
        <igx-icon igxDrawerItemIcon aria-hidden="true">code</igx-icon>
        <span igxDrawerItemText>Dev Tools</span>
      </span>
      <span igxDrawerItem [active]="isActive('/product/reveal')" igxRipple routerLink="/product/reveal">
        <igx-icon igxDrawerItemIcon aria-hidden="true">bar_chart</igx-icon>
        <span igxDrawerItemText>Reveal</span>
      </span>
      <span igxDrawerItem [active]="isActive('/product/slingshot')" igxRipple routerLink="/product/slingshot">
        <igx-icon igxDrawerItemIcon aria-hidden="true">rocket_launch</igx-icon>
        <span igxDrawerItemText>Slingshot</span>
      </span>

      <div class="nav-divider" role="separator"></div>

      <span igxDrawerItem [active]="isActive('/create')" igxRipple routerLink="/create">
        <igx-icon igxDrawerItemIcon aria-hidden="true">add_circle</igx-icon>
        <span igxDrawerItemText>Create Content</span>
      </span>
    </nav>
  </ng-template>
</igx-nav-drawer>

<div class="app-shell" [class.drawer-open]="drawerOpen()">
  <header class="app-toolbar" role="banner">
    <div class="toolbar-left">
      <button
        igxIconButton="flat"
        igxRipple
        (click)="toggleDrawer()"
        aria-label="Toggle navigation drawer"
        [attr.aria-expanded]="drawerOpen()">
        <igx-icon>menu</igx-icon>
      </button>
      <span class="toolbar-title">Marketing Content Control Panel</span>
    </div>
    <div class="toolbar-right">
      <button igxButton="raised" igxRipple (click)="navigateToCreate()" aria-label="Create new content">
        <igx-icon aria-hidden="true">add</igx-icon>
        New Content
      </button>
    </div>
  </header>

  <main class="app-content" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
